name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Provision Static Web App
        run: |
          site_id="$(az resource list \
            --resource-group alexke-rg \
            --resource-type Microsoft.Web/staticSites \
            --query "[?name=='alexkesite'].id | [0]" \
            --output tsv \
            --only-show-errors)"
          if [[ -z "$site_id" || "$site_id" == "None" ]]; then
            az deployment group create \
              --resource-group alexke-rg \
              --template-file deploy/static-web-app/template.json \
              --parameters @deploy/static-web-app/parameters.json \
              --only-show-errors \
              --output none
          fi
      - name: Get deployment token
        run: |
          token="$(az staticwebapp secrets list \
            --name alexkesite \
            --resource-group alexke-rg \
            --query properties.apiKey \
            --output tsv)"
          if [[ -z "$token" || "$token" == "None" ]]; then
            echo "::error::Azure Static Web Apps deployment token is missing"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "AZURE_STATIC_WEB_APPS_API_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               return await core.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
